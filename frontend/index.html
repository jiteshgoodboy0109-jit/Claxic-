<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Accredited academic courses, student applications, and learning management platform." />
    
    <!-- Content Security Policy for Scripts (Razorpay, Google Identity, Vite dev server, etc.) -->
    <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:* http://127.0.0.1:* https://checkout.razorpay.com https://accounts.google.com https://*.google.com https://*.googleapis.com blob:; script-src-elem 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:* http://127.0.0.1:* https://checkout.razorpay.com https://accounts.google.com https://*.google.com https://*.googleapis.com blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src * 'unsafe-inline' ws: wss:; frame-src * https://checkout.razorpay.com https://api.razorpay.com https://accounts.google.com;" />
    
    <!-- Google Fonts: DM Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Official Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-slate-900 selection:text-white min-h-screen">
